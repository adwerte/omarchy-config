server {
    listen 80;
    server_name 192.168.0.190; # Or use your custom domain/hostname if you have one
    # Automatically redirect root traffic to /admin/
    location / {
		root /usr/share/nginx/html;
		index index.html index.html;
    }
    # Reverse proxy configuration for Pi-hole
    location /admin/ {
        proxy_pass http://pihole_server:80/admin/; 
      
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options; 
    }
    location /api/ {
        proxy_pass http://pihole_server:80/api/; 
      
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options; 
    }
}
