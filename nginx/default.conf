server {
    listen 80 default_server;
    server_name _; # Or use your custom domain/hostname if you have one
    # Automatically redirect root traffic to /admin/
    location / {
	    proxy_pass http://actual_server:5006;

	    # Prevents header duplication between Upstream and Proxy
	    proxy_hide_header Cross-Origin-Embedder-Policy;
	    proxy_hide_header Cross-Origin-Opener-Policy;

	    # Explicitly set mandatory security headers
	    add_header Cross-Origin-Embedder-Policy "require-corp" always;
	    add_header Cross-Origin-Opener-Policy "same-origin" always;
	    add_header Origin-Agent-Cluster "?1" always;

	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
    }
    # Reverse proxy configuration for Pi-hole
    location /admin/ {
        proxy_pass http://pihole_server:80/admin/; 
      
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options; 
    }
    location /api/ {
        proxy_pass http://pihole_server:80/api/; 
      
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options; 
    }
}
