[[language]]
name = "markdown"
file-types = ["md"]
language-servers = ["harper-ls"]
auto-format = true
formatter = {command = "npx", args = ["prettier", "--parser", "markdown"]}

[[language]]
name = "python"
language-servers = ["pyright"]
file-types = ["py"]
auto-format = true
formatter = {command = "pwsh", args = ["-NoProfile", "-Command", "isort --stdout --profile black - | black --quiet --line-length 999 -"]}

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[[language]]
name = "rust"
file-types = ["rs"]
language-servers = ["rust-analyzer", "harper-ls"]

[language-server.rust-analyzer]
config = { check = { command = "clippy" } }
timeout = 60

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]
